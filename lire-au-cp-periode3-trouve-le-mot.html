<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lire au CP - Période 3 - Je trouve le mot</title>
<style>
:root{
  --bleu:#0b5ea8; --bleu-fonce:#08487f; --fond:#eef4fa; --carte:#ffffff;
  --texte:#1f2a37; --ok:#1a7f37; --ok-fond:#dff3e4; --ko:#b42318; --ko-fond:#fde7e4; --bord:#c9d6e4;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Andika','Trebuchet MS','Verdana',sans-serif;background:var(--fond);color:var(--texte);min-height:100vh;display:flex;justify-content:center;padding:16px}
main{width:100%;max-width:640px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:clamp(22px,5vw,30px);color:var(--bleu);line-height:1.2;text-align:center}
.sous{margin:0;text-align:center;font-size:clamp(16px,4vw,19px)}
.barre{height:14px;border-radius:7px;background:#d6e3f1;overflow:hidden}
.barre > div{height:100%;width:0;background:var(--bleu);border-radius:7px;transition:width .35s ease}
.compteur{margin:0;text-align:center;font-size:16px}
.carte{background:var(--carte);border:2px solid var(--bord);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:16px;align-items:center}
.image{width:min(100%,380px);aspect-ratio:288/200;border:8px solid var(--bleu);border-radius:10px;background:#fff;overflow:hidden}
.image img{width:100%;height:100%;object-fit:cover;display:block}
.choix{width:100%;display:flex;flex-direction:column;gap:10px}
.mot{font:inherit;font-size:clamp(24px,7vw,34px);font-weight:700;min-height:64px;padding:10px 16px;border-radius:14px;border:3px solid var(--bleu);background:#fff;color:var(--bleu);cursor:pointer;transition:transform .1s}
.mot:hover:not(:disabled){background:#e6f0fa}
.mot:active:not(:disabled){transform:scale(.98)}
.mot:focus-visible,.action:focus-visible{outline:4px solid #f5a623;outline-offset:3px}
.mot.juste{background:var(--ok-fond);border-color:var(--ok);color:var(--ok)}
.mot.faux{background:var(--ko-fond);border-color:var(--ko);color:var(--ko);animation:secoue .35s}
.mot:disabled{cursor:default}
@keyframes secoue{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media (prefers-reduced-motion:reduce){.mot.faux{animation:none}.barre > div{transition:none}}
.retour{min-height:30px;margin:0;font-size:clamp(18px,5vw,22px);font-weight:700;text-align:center}
.retour.ok{color:var(--ok)}
.retour.ko{color:var(--ko)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.action{font:inherit;font-size:clamp(18px,5vw,22px);font-weight:700;min-height:56px;padding:10px 24px;border-radius:14px;border:3px solid var(--bleu);background:var(--bleu);color:#fff;cursor:pointer;display:inline-flex;align-items:center;gap:10px}
.action.second{background:#fff;color:var(--bleu)}
.action:hover{background:var(--bleu-fonce);color:#fff}
.action svg{width:26px;height:26px;flex:none}
[hidden]{display:none !important}
.fin{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.fin h2{margin:0;font-size:clamp(24px,6vw,32px);color:var(--bleu)}
.etoiles{display:flex;gap:8px;justify-content:center}
.etoiles svg{width:48px;height:48px}
.score{margin:0;font-size:clamp(20px,5vw,26px);font-weight:700}
.revoir{width:100%;text-align:left}
.revoir h3{margin:0 0 8px;font-size:20px}
.revoir ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.revoir li{background:var(--ko-fond);border:2px solid var(--ko);border-radius:12px;padding:6px 12px;font-size:20px;font-weight:700;color:var(--ko)}

/* Mise en page paysage compacte : tout le jeu visible sans défilement */
@media (min-width:600px){
  body{padding:8px;min-height:0;align-items:flex-start}
  main{max-width:900px;gap:6px}
  h1{font-size:clamp(18px,2.6vw,24px)}
  .sous{font-size:15px}
  .barre{height:10px}
  .compteur{font-size:14px}
  .carte{padding:12px}
  #jeu{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 1fr auto;column-gap:18px;row-gap:8px;align-items:center}
  #jeu .image{grid-column:1;grid-row:1 / span 3;width:100%;aspect-ratio:288/200;border-width:6px}
  #jeu .choix{grid-column:2;grid-row:1;gap:8px;align-self:end}
  #jeu .retour{grid-column:2;grid-row:2;min-height:26px;font-size:clamp(16px,2.2vw,20px)}
  #jeu .actions{grid-column:2;grid-row:3;align-self:start}
  .mot{font-size:clamp(20px,3.2vw,28px);min-height:52px;padding:6px 12px}
  .action{font-size:clamp(16px,2.2vw,20px);min-height:46px;padding:6px 18px}
  .fin{gap:8px}
  .fin h2{font-size:26px}
  .etoiles svg{width:40px;height:40px}
  .score{font-size:20px}
  .revoir li{font-size:17px;padding:4px 10px}
}
@media (min-width:600px) and (max-height:520px){
  h1{font-size:19px}
  .sous{font-size:14px;line-height:1.2}
  .carte{padding:10px}
  #jeu .image{max-height:calc(100vh - 150px);width:auto;max-width:100%;justify-self:center}
}
</style>
</head>
<body>
<main>
  <h1>Je trouve le mot qui correspond à l'image</h1>
  <p class="sous" style="font-weight:700;color:var(--bleu)">Période 3</p>
  <p class="sous" id="consigne">Regarde l'image, puis touche le bon mot.</p>
  <div class="barre" role="progressbar" aria-label="Avancement" aria-valuemin="0" aria-valuemax="15" aria-valuenow="0" id="barre"><div id="barreInterne"></div></div>
  <p class="compteur" id="compteur"></p>

  <section class="carte" id="jeu">
    <div class="image"><img id="image" alt="Image à associer à un mot"></div>
    <div class="choix" id="choix"></div>
    <p class="retour" id="retour" role="status" aria-live="polite"></p>
    <div class="actions">
      <button class="action second" id="ecouter" type="button" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>
        Écouter
      </button>
      <button class="action" id="suivant" type="button" hidden>Suivant</button>
    </div>
  </section>

  <section class="carte fin" id="fin" hidden>
    <h2>Bravo !</h2>
    <div class="etoiles" id="etoiles" aria-hidden="true"></div>
    <p class="score" id="score"></p>
    <div class="revoir" id="revoir" hidden>
      <h3>Mots à revoir</h3>
      <ul id="listeRevoir"></ul>
    </div>
    <button class="action" id="rejouer" type="button">Rejouer</button>
  </section>
</main>

    el.etoiles.innerHTML = etoile(true) + etoile(n>=2) + etoile(n>=3);
    el.score.textContent = premierCoup + ' mot' + (premierCoup>1?'s':'') + ' trouvé' + (premierCoup>1?'s':'') + ' du premier coup sur ' + TOTAL;
    el.listeRevoir.innerHTML = '';
    if(aRevoir.length){
      aRevoir.forEach(function(cle){ var li=document.createElement('li'); li.textContent = MOTS[cle]; el.listeRevoir.appendChild(li); });
      el.revoir.hidden = false;
    }else{ el.revoir.hidden = true; }
    el.rejouer.focus();
  }

  el.suivant.addEventListener('click', function(){
    if(index === TOTAL-1){ terminer(); } else { index++; afficher(); }
  });
  el.ecouter.addEventListener('click', function(){ parler(MOTS[motCourant]); });
  el.rejouer.addEventListener('click', demarrer);

  demarrer();
})();
</script>
</body>
</html>
