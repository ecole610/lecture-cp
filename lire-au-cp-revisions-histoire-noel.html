<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lire au CP - Révisions - L'histoire de Noël de Fil et Lulu</title>
<style>
:root{--bleu:#0b5ea8;--fond:#eef4fa;--ok:#1a7f37;--ok-fond:#dff3e4;--ko:#b42318;--ko-fond:#fde7e4;--bord:#c9d6e4;--or:#f5a623}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Andika','Trebuchet MS','Verdana',sans-serif;background:var(--fond);color:#1f2a37;padding:8px 12px;display:flex;justify-content:center}
main{width:100%;max-width:960px;display:flex;flex-direction:column;gap:8px}
h1{margin:0;font-size:clamp(17px,2.6vw,23px);color:var(--bleu);text-align:center}
.consigne{margin:0;text-align:center;font-size:clamp(15px,2.2vw,19px);font-weight:700;min-height:26px}
.zone{background:#fff;border:2px solid var(--bord);border-radius:16px;padding:10px}
.relier{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.col{display:flex;flex-direction:column;gap:8px}
.ligne{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;align-items:stretch}
.bloc{font:inherit;border:3px solid var(--bleu);border-radius:12px;background:#fff;cursor:pointer;padding:0;overflow:hidden;color:#1f2a37}
.bloc img{display:block;width:100%;height:100%;object-fit:contain;background:#fff}
.bloc.im{aspect-ratio:3/2}
.bloc.tx{padding:6px 10px;text-align:left;font-size:clamp(14px,2vw,19px);font-weight:600;line-height:1.3;display:flex;align-items:center}
.bloc.sel{border-color:var(--or);box-shadow:0 0 0 4px #f5a62366}
.bloc.ok{border-color:var(--ok);background:var(--ok-fond);cursor:default}
.bloc.faux{animation:sec .35s;border-color:var(--ko)}
@keyframes sec{0%,100%{transform:translateX(0)}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){.bloc.faux{animation:none}}
.bloc:focus-visible,.btn:focus-visible{outline:4px solid var(--or);outline-offset:2px}
.btn{font:inherit;font-weight:700;font-size:clamp(16px,2.2vw,20px);min-height:46px;padding:6px 22px;border-radius:14px;border:3px solid var(--bleu);background:var(--bleu);color:#fff;cursor:pointer;align-self:center}
.badge{position:relative}
.num{position:absolute;top:4px;left:4px;background:var(--bleu);color:#fff;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px;z-index:2}
.cartes{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.cartes .bloc.im{width:100%}
.histoire{display:flex;flex-direction:column;gap:6px}
.histoire .ligne .im{border-color:var(--bleu);cursor:default}
.histoire .t{display:flex;align-items:center;font-size:clamp(15px,2.3vw,21px);font-weight:600;line-height:1.35;padding:4px 8px}
.histoire .ligne{grid-template-columns:minmax(0,.9fr) 1.6fr}
.histoire .bloc.im{max-height:clamp(60px,calc((100vh - 170px)/5),150px)}
.centre{display:flex;justify-content:center;margin-top:4px}
[hidden]{display:none!important}
@media (max-width:640px){.relier{grid-template-columns:1fr 1fr}.cartes{grid-template-columns:repeat(2,1fr)}}
.col{display:grid;grid-template-rows:repeat(5,minmax(0,1fr));height:clamp(300px,calc(100vh - 110px),560px)}
.col .bloc.im{aspect-ratio:auto;min-height:0}
.col .bloc.tx{min-height:0;font-size:clamp(12px,min(2vw,2.7vh),19px);line-height:1.2;padding:3px 8px}
.histoire .bloc.im{max-height:clamp(60px,calc((100vh - 190px)/5),150px)}
@media (max-width:640px){.col{height:auto;grid-template-rows:none}.col .bloc.im{aspect-ratio:3/2}.col .bloc.tx{font-size:16px}}
:root{--rh:clamp(56px,calc((100vh - 120px)/5 - 8px),112px)}
.col{height:calc(var(--rh)*5 + 32px)}
.col .bloc.im{width:calc(var(--rh)*1.5);height:var(--rh);justify-self:start}
#relier .ligne{grid-template-columns:auto 1fr;justify-content:center}
.histoire .ligne{grid-template-columns:auto 1fr}
.histoire .bloc.im{width:calc(var(--rh)*1.5);height:var(--rh);max-height:none}
@media (max-width:640px){.col{height:auto}.col .bloc.im{width:100%;height:auto}}
.histoire{--rh:clamp(50px,calc((100vh - 170px)/5 - 6px),112px)}
.centre{margin-top:2px}.btn{min-height:40px}
@media (max-width:640px){.histoire{--rh:auto}.histoire .bloc.im{width:100%;height:auto;aspect-ratio:3/2}.histoire .ligne{grid-template-columns:1fr 1.4fr}}
</style></head><body><main>
<h1>L'histoire de Noël de Fil et Lulu</h1>
<p class="consigne" id="consigne" role="status" aria-live="polite"></p>
<section class="zone" id="e1"><div id="relier"></div></section>
<section class="zone" id="e2" hidden><div class="cartes" id="cartes"></div></section>
<section class="zone" id="e3" hidden><div class="histoire" id="histoire"></div><div class="centre"><button class="btn" id="rejouer" type="button">Rejouer</button></div></section>
</main>

function bloc(type,i){
  var b=document.createElement('button');b.type='button';b.className='bloc '+type;b.dataset.i=i;b.dataset.t=type;
  if(type==='im'){var im=document.createElement('img');im.src=IMG[i];im.alt='Image de l\u2019histoire';b.appendChild(im)}else{b.textContent=TXT[i]}
  b.addEventListener('click',function(){clic(b)});return b;
}
function clic(b){
  if(b.classList.contains('ok'))return;
  if(!sel){sel=b;b.classList.add('sel');return}
  if(sel===b){b.classList.remove('sel');sel=null;return}
  if(sel.dataset.t===b.dataset.t){sel.classList.remove('sel');sel=b;b.classList.add('sel');return}
  var a=sel;sel=null;a.classList.remove('sel');
  if(a.dataset.i===b.dataset.i){
    a.classList.add('ok');b.classList.add('ok');trouves++;

  }else{
    [a,b].forEach(function(x){x.classList.remove('faux');void x.offsetWidth;x.classList.add('faux')});
    $('consigne').textContent='Essaie encore !';
  }
}
function etape2(){
