:root{--bleu:#17a2dd;--bleu-fonce:#0b5ea8;--marine:#0e2f4d;--fond:#eef4fa;--ok:#1a7f37;--ok-fond:#dff3e4;--ko:#b42318;--ko-fond:#fde7e4}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Adventor','Century Gothic','Trebuchet MS',sans-serif;background:var(--fond);color:var(--marine);min-height:100vh;display:flex;justify-content:center;padding:8px 12px}
main{width:100%;max-width:760px;display:flex;flex-direction:column;align-items:center;gap:8px}
h1{margin:0;font-size:clamp(18px,3.2vw,26px);color:var(--bleu-fonce);text-align:center;line-height:1.2}
.compteur{margin:0;font-size:15px}
.barre{width:100%;height:10px;border-radius:5px;background:#d6e3f1;overflow:hidden}
.barre>div{height:100%;width:0;background:var(--bleu);transition:width .3s}
.scene{width:min(100%,520px);height:clamp(180px,48vh,300px);perspective:1200px}
.carte{position:relative;width:100%;height:100%;border:0;padding:0;background:none;cursor:pointer;font:inherit;transform-style:preserve-3d;transition:transform .6s}
.carte.retournee{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 14px rgba(14,47,77,.22);overflow:hidden}
.recto{background:var(--bleu);color:#fff;font-size:clamp(40px,10.5vw,76px);font-weight:700;flex-direction:column;gap:6px}
.recto small{font-size:clamp(13px,2.4vw,16px);font-weight:400;opacity:.9}
.verso{background:#fff;border:6px solid var(--bleu);transform:rotateY(180deg);flex-direction:column;padding:6px}
.verso img{width:100%;flex:1;min-height:0;object-fit:contain}
.verso span{font-size:clamp(20px,4vw,28px);font-weight:700;color:var(--bleu-fonce);line-height:1.2;padding-bottom:2px}
.carte:focus-visible,.action:focus-visible{outline:4px solid #f5a623;outline-offset:4px}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;min-height:54px}
.action{font:inherit;font-size:clamp(16px,2.6vw,20px);font-weight:700;min-height:50px;padding:8px 20px;border-radius:14px;border:3px solid var(--bleu-fonce);background:var(--bleu-fonce);color:#fff;cursor:pointer}
.action.ok{background:var(--ok);border-color:var(--ok)}
.action.ko{background:#fff;color:var(--ko);border-color:var(--ko)}
.action.second{background:#fff;color:var(--bleu-fonce)}
[hidden]{display:none !important}
.fin{width:100%;text-align:center;background:#fff;border:2px solid #c9d6e4;border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px;align-items:center}
.fin h2{margin:0;font-size:28px;color:var(--bleu-fonce)}
.etoiles{display:flex;gap:6px}.etoiles svg{width:42px;height:42px}
.score{margin:0;font-size:20px;font-weight:700}
.revoir ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.revoir li{background:var(--ko-fond);border:2px solid var(--ko);border-radius:12px;padding:4px 12px;font-size:18px;font-weight:700;color:var(--ko)}
@media (prefers-reduced-motion:reduce){.carte{transition:none}.barre>div{transition:none}}
</style>
</head>
<body>
<main>
  <h1>Je lis la carte, puis je clique pour vérifier</h1>
  <p class="compteur" id="compteur"></p>
  <div class="barre" id="barre" role="progressbar" aria-label="Avancement" aria-valuemin="0" aria-valuemax="8" aria-valuenow="0"><div id="barreInterne"></div></div>

  <section id="jeu" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:10px">
    <div class="scene">
      <button class="carte" id="carte" type="button" aria-label="Carte à retourner">
        <span class="face recto" id="recto"></span>
        <span class="face verso"><img id="image" alt=""><span id="legende"></span></span>
      </button>
    </div>
    <div class="actions" id="actions">
      <button class="action" id="verifier" type="button">Je vérifie</button>
      <button class="action second" id="ecouter" type="button" hidden>Écouter</button>
      <button class="action ok" id="bien" type="button" hidden>J'ai bien lu</button>
      <button class="action ko" id="revoir" type="button" hidden>À revoir</button>
    </div>
  </section>

  <section class="fin" id="fin" hidden>
    <h2>Bravo !</h2>
    <div class="etoiles" id="etoiles" aria-hidden="true"></div>
    <p class="score" id="score"></p>
    <div class="revoir" id="zoneRevoir" hidden>
      <strong>Cartes à revoir</strong>
      <ul id="listeRevoir"></ul>
    </div>
    <div class="actions">
      <button class="action second" id="rejouerDifficiles" type="button" hidden>Revoir les cartes difficiles</button>
      <button class="action" id="rejouer" type="button">Tout rejouer</button>
    </div>
  </section>
</main>

      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(texte); u.lang='fr-FR'; u.rate=0.85;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
  function demarrer(cles){
    ordre = melanger(cles); total = ordre.length; index = 0; bien = 0; aRevoir = [];
    el.fin.hidden = true; el.jeu.hidden = false;
    el.barre.setAttribute('aria-valuemax', total);
    afficher();
  }
  function afficher(){
    var cle = ordre[index];
    retournee = false;
    el.carte.classList.remove('retournee');
    el.recto.innerHTML = '';
    var mot = document.createElement('span'); mot.textContent = MOTS[cle]; el.recto.appendChild(mot);
    el.image.src = IMG[cle]; el.image.alt = MOTS[cle]; el.legende.textContent = MOTS[cle];
    el.carte.setAttribute('aria-label', 'Carte : ' + MOTS[cle] + '. Appuie pour vérifier.');
    el.verifier.hidden = false; el.ecouter.hidden = true; el.bien.hidden = true; el.revoir.hidden = true;
    el.compteur.textContent = 'Carte ' + (index+1) + ' sur ' + total;
    el.barreInterne.style.width = (index/total*100) + '%';
    el.barre.setAttribute('aria-valuenow', index);
  }
  function retourner(){
    if(retournee){ return; }
    retournee = true;
    el.carte.classList.add('retournee');
    el.verifier.hidden = true; el.ecouter.hidden = false; el.bien.hidden = false; el.revoir.hidden = false;
    el.carte.setAttribute('aria-label', 'Image : ' + MOTS[ordre[index]]);
    parler(MOTS[ordre[index]]);
    el.bien.focus();
  }
  function suite(ok){
    if(ok){ bien++; } else { aRevoir.push(ordre[index]); }
    if(index === total-1){ terminer(); } else { index++; afficher(); el.carte.focus(); }
  }
  function etoile(pleine){
    return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6 6.6.8-4.9 4.5 1.3 6.5L12 17l-5.9 3.3 1.3-6.5L2.5 9.3l6.6-.8z" fill="'+(pleine?'#f5a623':'#e3eaf2')+'" stroke="'+(pleine?'#c77f00':'#b8c6d6')+'" stroke-width="1.2" stroke-linejoin="round"/></svg>';
  }
  function terminer(){
    el.jeu.hidden = true; el.fin.hidden = false;
    el.barreInterne.style.width = '100%'; el.barre.setAttribute('aria-valuenow', total);
    el.compteur.textContent = '';
    var n = (bien >= total*0.9) ? 3 : (bien >= total*0.6) ? 2 : 1;
    el.etoiles.innerHTML = etoile(true) + etoile(n>=2) + etoile(n>=3);
    el.score.textContent = bien + ' carte' + (bien>1?'s':'') + ' bien lue' + (bien>1?'s':'') + ' sur ' + total;
    el.listeRevoir.innerHTML = '';
    if(aRevoir.length){
      aRevoir.forEach(function(cle){ var li=document.createElement('li'); li.textContent=MOTS[cle]; el.listeRevoir.appendChild(li); });
      el.zoneRevoir.hidden = false; el.rejouerDifficiles.hidden = false;
    }else{ el.zoneRevoir.hidden = true; el.rejouerDifficiles.hidden = true; }
    el.rejouer.focus();
  }

  el.carte.addEventListener('click', function(){ if(retournee){ return; } retourner(); });
  el.verifier.addEventListener('click', retourner);
  el.ecouter.addEventListener('click', function(){ parler(MOTS[ordre[index]]); });
  el.bien.addEventListener('click', function(){ suite(true); });
  el.revoir.addEventListener('click', function(){ suite(false); });
  el.rejouer.addEventListener('click', function(){ demarrer(Object.keys(MOTS)); });
  el.rejouerDifficiles.addEventListener('click', function(){ demarrer(aRevoir.slice()); });

  demarrer(Object.keys(MOTS));
})();
</script>
</body>
</html>
