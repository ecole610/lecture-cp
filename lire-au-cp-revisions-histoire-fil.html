:root{--bleu:#17a2dd;--bleu-fonce:#0b5ea8;--marine:#0e2f4d;--fond:#eef4fa;--ok:#1a7f37;--ok-fond:#dff3e4;--ko:#b42318}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Adventor','Century Gothic','Trebuchet MS',sans-serif;background:var(--fond);color:var(--marine);min-height:100vh;display:flex;justify-content:center;padding:8px 12px}
main{width:100%;max-width:980px;display:flex;flex-direction:column;align-items:center;gap:8px}
.bandeau{width:100%;background:var(--bleu);color:#fff;border-radius:12px;padding:6px 14px;text-align:center;font-weight:700;font-size:clamp(15px,2.4vw,20px);line-height:1.2}
.bandeau small{display:block;font-weight:400;font-size:clamp(12px,1.8vw,15px);opacity:.95}
.barre{width:100%;height:8px;border-radius:5px;background:#d6e3f1;overflow:hidden}
.barre>div{height:100%;width:0;background:var(--bleu);transition:width .3s}
section{width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.relier{position:relative;width:100%;height:clamp(250px,calc(100vh - 150px),540px);display:flex;justify-content:space-between}
.col{display:flex;flex-direction:column;gap:6px;height:100%;position:relative;z-index:2}
.gauche{width:46%}.droite{width:30%}
.col>button{flex:1;min-height:0}
.texte{font:inherit;font-weight:700;color:var(--bleu-fonce);background:#fff;border:4px solid var(--bleu);border-radius:12px;padding:2px 8px;text-align:left;cursor:pointer;font-size:clamp(12px,min(2.3vw,3.6vh),23px);line-height:1.2}
.texte.sel,.img.sel{border-color:#f5a623;box-shadow:0 0 0 3px rgba(245,166,35,.45)}
.texte.lie,.img.lie{border-color:var(--ok);cursor:default}
#traits{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}
#traits line{stroke:var(--ok);stroke-width:5;stroke-linecap:round}
.phrase{width:100%;background:#fff;border:5px solid var(--bleu);border-radius:16px;padding:10px 16px;text-align:center;font-weight:700;color:var(--bleu-fonce);font-size:clamp(20px,3.6vw,34px);line-height:1.25;min-height:calc(2.5em + 20px);display:flex;align-items:center;justify-content:center;gap:12px}
.phrase button{font:inherit;font-size:20px;border:0;background:var(--bleu);color:#fff;border-radius:50%;width:44px;height:44px;cursor:pointer;flex:none}
.choix{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.img{border:4px solid #c9d6e4;border-radius:12px;background:#fff;padding:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;min-width:0}
.img img{width:100%;height:100%;object-fit:contain;display:block}

.img:focus-visible,.carte:focus-visible,.action:focus-visible{outline:4px solid #f5a623;outline-offset:3px}
.consigne{margin:0;font-size:clamp(14px,2.2vw,17px);text-align:center}
.rang{width:100%;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{position:relative;border:3px dashed #9fb6cc;border-radius:14px;min-height:60px;background:rgba(255,255,255,.5)}
.slot>b{position:absolute;top:-2px;left:-2px;z-index:2;width:26px;height:26px;border-radius:50%;background:var(--bleu-fonce);color:#fff;display:flex;align-items:center;justify-content:center;font-size:15px}
.carte{display:flex;flex-direction:column;align-items:center;gap:4px;width:100%;border:4px solid var(--bleu);border-radius:12px;background:#fff;padding:4px;font:inherit;color:var(--marine);cursor:pointer;min-width:0}
.carte img{width:100%;aspect-ratio:3/2;object-fit:contain}
.carte span{font-size:clamp(12px,1.7vw,16px);line-height:1.2;font-weight:700;padding:0 2px 2px}
.slot .carte{cursor:default;border-color:var(--ok);height:100%}
.fin .slot .carte span{font-size:clamp(14px,2vw,19px)}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.action{font:inherit;font-size:clamp(16px,2.6vw,20px);font-weight:700;min-height:48px;padding:6px 20px;border-radius:14px;border:3px solid var(--bleu-fonce);background:var(--bleu-fonce);color:#fff;cursor:pointer}
.action.second{background:#fff;color:var(--bleu-fonce)}
.etoiles{display:flex;gap:6px}.etoiles svg{width:38px;height:38px}
.score{margin:0;font-size:18px;font-weight:700;text-align:center}
.bon{outline:5px solid var(--ok);border-color:var(--ok)}
.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
[hidden]{display:none !important}
@media (max-width:640px){.choix,.rang{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}.barre>div{transition:none}}
</style>
</head>

    l.dataset.t=a.dataset.k; $('traits').appendChild(l);

    var svg=$('traits'); svg.innerHTML='';
    [].forEach.call($('colT').querySelectorAll('.lie'),function(a){

  function choisir(b,cote,k){
    if(b.classList.contains('lie')) return;
    if(!sel || sel.cote===cote){
      if(sel) sel.b.classList.remove('sel');
      sel={b:b,cote:cote,k:k}; b.classList.add('sel'); return;
    }
    var autre=sel; sel=null; autre.b.classList.remove('sel');
    if(autre.k===k){
      var bt=cote==='T'?b:autre.b, bi=cote==='I'?b:autre.b;

    }else{ erreurs++; secoue(b); secoue(autre.b); }
  }

  }

    var h=$('histoire'); h.innerHTML='';

    var t=$('tas'); t.innerHTML=''; tas=melanger([0,1,2,3,4]);
    tas.forEach(function(k){
      var c=carte(k,true); c.addEventListener('click',function(){ placer(c,k); }); t.appendChild(c);

  }
